
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso - GALINJUEGOS</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <h1>GALINJUEGOS</h1>
  <h2>Acceso de usuarios</h2>

  <div id="login">
    <p>Inicia sesión para comprobar tu acceso.</p>

    <input id="email" type="email"
      placeholder="Correo electrónico">

    <br><br>

    <input id="password" type="password"
      placeholder="Contraseña">

    <br><br>

    <button id="entrar">INICIAR SESIÓN</button>
  </div>

  <p id="mensaje">Esperando inicio de sesión...</p>

  <script>
    const SUPABASE_URL =
      "https://nloapfrvzhuapbfgioug.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_ep2tq4BTA_5pNoBIMYBJRg__qiKuie_";

    const supabase = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const mensaje = document.getElementById("mensaje");
    const login = document.getElementById("login");

    async function comprobarAcceso() {
      mensaje.textContent = "Comprobando acceso...";

      try {
        const { data: { user }, error } =
          await supabase.auth.getUser();

        if (error) throw error;

        if (!user) {
          mensaje.textContent =
            "Inicia sesión para continuar.";
          return;
        }

        const { data, error: errorSolicitud } =
          await supabase
            .from("access_requests")
            .select("status")
            .eq("email", user.email)
            .maybeSingle();

        if (errorSolicitud) throw errorSolicitud;

        if (data?.status === "approved") {
          login.style.display = "none";
          mensaje.textContent =
            "Acceso aprobado. Bienvenido a GALINJUEGOS.";
        } else if (data?.status === "pending") {
          mensaje.textContent =
            "Tu solicitud todavía está pendiente.";
        } else {
          mensaje.textContent =
            "No tienes una solicitud aprobada.";
        }

      } catch (error) {
        mensaje.textContent =
          "No se pudo comprobar el acceso: " + error.message;
      }
    }

    document.getElementById("entrar")
      .addEventListener("click", async () => {

        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;

        if (!email || !password) {
          mensaje.textContent =
            "Introduce tu correo y contraseña.";
          return;
        }

        mensaje.textContent = "Iniciando sesión...";

        const { error } =
          await supabase.auth.signInWithPassword({
            email,
            password
          });

        if (error) {
          mensaje.textContent =
            "No se pudo iniciar sesión. Comprueba tus datos.";
          return;
        }

        await comprobarAcceso();
      });

    comprobarAcceso();
  </script>
</body>
</html>
